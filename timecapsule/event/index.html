<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031e28"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>QwerNFC TimeCapsule · Event Web</title>
<style>
:root{color-scheme:dark;background:#041b27;color:#f0fffa;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{min-height:100dvh;margin:0;background:radial-gradient(circle at top right,#075f51,transparent 60%),#041b27}
main{max-width:550px;padding:48px 21px;margin:0 auto}
span{font-size:10px;color:#3eebd0;font-weight:800;letter-spacing:.12em}
h1{font-size:clamp(29px,7vw,44px);line-height:1.16}
p{color:#b3d6d3;line-height:1.7}
section{background:#062936;border:1px solid #197981;border-radius:16px;padding:21px;margin-top:25px}
a{display:inline-block;color:#3ce3ca;text-decoration:underline;overflow-wrap:anywhere}
</style></head><body><main><span>QWERNFC TIMECAPSULE · EVENT WEB</span><h1 id="title">Opening your event…</h1>
<section><p id="status" role="status">Checking this published event address.</p><a id="continue" hidden rel="noreferrer noopener">Continue to Event Web</a></section>
<p style="font-size:11px">Event information is supplied by TimeCapsule's secure backend. No Google password or guest login is requested.</p>
</main><script>
(()=>{'use strict';
const raw=new URL(location.href).searchParams.get('id')||'';
const status=document.getElementById('status'),title=document.getElementById('title'),link=document.getElementById('continue');
if(!/^[a-f0-9]{32}$/.test(raw)){
 title.textContent='Event link unavailable';
 status.textContent='Use the exact event website link supplied by the organizer.';
 return;
}
const destination='https://qwernfc-timecapsule-staging.qwernfctc99.workers.dev/event/'+raw+'/';
title.textContent='Opening QwerNFC TimeCapsule';
status.textContent='Redirecting securely to the selected Camera or Gallery experience…';
link.href=destination;link.hidden=false;link.textContent='Open event';
location.replace(destination);
})();
</script></body></html>
